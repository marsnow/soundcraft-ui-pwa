name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site/icons
          cp output/playwright/index.html \
            output/playwright/embed-check.html \
            output/playwright/app.css \
            output/playwright/app.js \
            output/playwright/manifest.webmanifest \
            output/playwright/sw.js \
            _site/
          cp output/playwright/icons/soundcraft-ui-192.png \
            output/playwright/icons/soundcraft-ui-512.png \
            _site/icons/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
